# External Routing - Configuration
# =================================
# Edit this file to configure domain-based routing.

# --- Enable/disable ---
# Master switch: 1 = routing active (default), 0 = fully disabled.
# While disabled, NetworkManager events and the refresh timer leave
# routing rules untouched. Prefer `llx-exroute-cli enable`/`disable`
# over editing this by hand, since those also apply the change live.
ENABLED=1

# --- Network interfaces ---
# Corporate network interface (default gateway)
CORPORATE_IFACE="eth0"

# External WiFi interface (selective routing)
EXTERNAL_IFACE="wlan0"

# --- Routing table ---
# Routing table number for external routing
ROUTING_TABLE=100

# --- Domains ---
# Space-separated list of domains to route through external WiFi.
# Automatically resolved to IPs. Subdomains are also resolved.
# Example: DOMAINS="tailscale.com tailscale.io anydesk.com facebook.com fbcdn.net"
DOMAINS=""

# --- IPs ---
# Space-separated list of literal IPv4 addresses/CIDRs to route through
# external WiFi, bypassing DNS resolution entirely.
# Example: IPS="172.28.222.250 10.0.0.0/24"
#
# The external interface's own local network (e.g. 192.168.1.0/24) is
# detected and added here automatically, so devices on that WiFi (router,
# printer, NAS...) stay reachable. Managed automatically; don't edit by hand.
IPS=""

# Local networks removed deliberately via `llx-exroute-cli remove ip`.
# Kept so auto-detection above won't re-add them. Managed automatically.
EXCLUDED_IPS=""

# --- DNS ---
# DNS servers to resolve via the external interface.
# If empty, uses the ones assigned by external WiFi DHCP.
EXTERNAL_DNS=""

# --- Refresh ---
# IP refresh interval in minutes (for systemd timer)
REFRESH_INTERVAL=15

# --- Logging ---
# Log file (empty = no logging)
LOG_FILE="/var/log/llx-external-routing.log"

# Verbosity level: 0=minimal, 1=normal, 2=verbose
VERBOSE=1
