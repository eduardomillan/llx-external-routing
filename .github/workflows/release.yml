name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper fakeroot dpkg-dev

      - name: Read version
        id: version
        run: |
          source conf/version.conf
          echo "tag=v${VERSION}-${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: build/output/*
